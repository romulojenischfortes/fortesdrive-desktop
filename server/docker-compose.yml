# FortesDrive — armazenamento próprio
#
# Um único serviço: o gateway que autentica, confere o checksum de cada envio e
# grava o arquivo direto na pasta de dados deste computador. Não existe serviço
# intermediário para cair — se o gateway está no ar, a gravação funciona (e ele
# mesmo confirma isso com um teste real antes de o app autorizar um envio).
#
# Só o gateway aparece para fora, e apenas na porta local 8790 — quem publica
# para a internet é o túnel descrito no README (HTTPS obrigatório).
#
#   docker compose up -d --build
#
name: fortesdrive-storage

services:
  gateway:
    build: ./gateway
    env_file:
      - ./.env
    environment:
      PORT: "8790"
      DATA_DIR: /data
    volumes:
      # Pasta dos dados (variável FD_DATA_DIR do arquivo .env; pode apontar para
      # outro disco, ex: D:\FortesDriveServer\data). É aqui que os arquivos
      # ficam — a cópia de segurança é copiar esta pasta.
      - ${FD_DATA_DIR:-./data}:/data
    ports:
      # Publicado só no próprio computador: o túnel fala com ele por aqui.
      - "127.0.0.1:8790:8790"
    restart: unless-stopped