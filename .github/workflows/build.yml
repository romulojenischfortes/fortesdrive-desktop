name: Build Installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Test native transfers and updater
        run: node --test tests/native.test.cjs tests/updater.test.cjs
      - name: Set unique update version
        id: version
        shell: pwsh
        run: |
          $base = (Get-Content package.json | ConvertFrom-Json).version.Split('.')
          $version = "$($base[0]).$($base[1]).${{ github.run_number }}"
          npm version $version --no-git-tag-version
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: node generate-icon.js
      - run: npx electron-builder --win nsis --publish never
      - name: Publish installer and update feed
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          tag_name: v${{ steps.version.outputs.version }}
          name: FortesDrive Desktop ${{ steps.version.outputs.version }}
          body: |
            Correções na sincronização, proteção de arquivos ignorados e atualizador integrado.
            Após esta instalação inicial, use Atualizações do aplicativo para as próximas versões.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}